# 墨引 MoYin — 标准版（含 Redis：元数据缓存 / 登录限流）
# 安装：
#   mkdir -p moyin/config && cd moyin
#   curl -fsSL -o docker-compose.yml https://raw.githubusercontent.com/streamstack-cn/moyin/main/docker-compose.redis.yml
#   docker compose up -d
# 访问：http://<主机IP>:8420

services:
  redis:
    image: redis:7.2-alpine
    container_name: moyin-redis
    restart: unless-stopped
    command: redis-server --requirepass change_me_redis --appendonly yes
    volumes:
      - moyin-redis-data:/data

  moyin:
    image: streamstack/moyin:latest
    container_name: moyin
    restart: unless-stopped
    depends_on:
      - redis
    ports:
      - "8420:8420"
    volumes:
      - ./config:/config
      # 可选：挂载本机电子书目录（只读），取消注释并改成你的路径
      # - /path/to/your/ebooks:/library-source:ro
    environment:
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: change_me          # 首次启动生效，请改成强密码
      MOYIN_SECRET_KEY: change_me_secret # 请改成随机长字符串
      MOYIN_LIBRARY_ROOT: /library-source
      REDIS_URL: redis://:change_me_redis@redis:6379/0

volumes:
  moyin-redis-data:
