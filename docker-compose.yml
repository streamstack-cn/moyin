# 墨引 MoYin — 精简版（不含 Redis）
# 安装：
#   mkdir -p moyin/config && cd moyin
#   curl -fsSL -o docker-compose.yml https://raw.githubusercontent.com/streamstack-cn/moyin/main/docker-compose.yml
#   # 按需修改下方密码、电子书目录后：
#   docker compose up -d
# 访问前端：http://<主机IP>:6173

services:
  moyin:
    image: streamstack/moyin:latest
    container_name: moyin
    restart: unless-stopped
    ports:
      - "6173:6173"
    volumes:
      - ./config:/config
      # 电子书目录需可读写：页面删除图书时会物理删除源文件。改成你的路径后取消注释：
      # - /path/to/your/ebooks:/library-source
    environment:
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: change_me          # 首次启动生效，请改成强密码
      MOYIN_SECRET_KEY: change_me_secret # 请改成随机长字符串
      MOYIN_LIBRARY_ROOT: /library-source
