server {
    listen 6173;
    server_name _;

    root /app/frontend/dist;
    index index.html;

    # 上传电子书体积可能较大（扫描目录导入除外，这里指网页直传）
    client_max_body_size 512m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/xml image/svg+xml;

    # 后端 API 反代（含电子书正文流式读取 / 大文件下载）
    location /api/ {
        proxy_pass http://127.0.0.1:8421/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 电子书扫描导入 / 格式转换耗时较长，适当放宽超时
        proxy_read_timeout 600;
        proxy_connect_timeout 60;
        proxy_send_timeout 600;

        # 透传 Range 请求头，支持 epub.js / 下载断点续传
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;

        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # /assets/ 下文件名带 content-hash，可放心长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|json)$ {
        expires 1d;
        add_header Cache-Control "public, no-cache";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri =404;
    }

    # React SPA 路由兜底
    location / {
        try_files $uri $uri/ /index.html;
    }
}
