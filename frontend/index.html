<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b1014" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="墨引" />
    <meta name="application-name" content="墨引" />
    <!-- 首屏关键样式：在主 CSS（经 JS 加载）到达前锁定视口宽度，避免手机端先放大再手动缩放 -->
    <style>
      html {
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
        width: 100%;
        max-width: 100%;
        overflow-x: clip;
      }
      body {
        margin: 0;
        width: 100%;
        max-width: 100%;
        overflow-x: clip;
      }
      #root {
        width: 100%;
        max-width: 100%;
        min-height: 100%;
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Serif+SC:wght@400;500;600;700&display=swap"
    />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>墨引 MoYin</title>
    <script>
      // 在 React 挂载前设置主题，避免出现"先亮后暗/先暗后亮"的闪烁
      try {
        var t = localStorage.getItem('moyin_theme') || 'dark'
        document.documentElement.setAttribute('data-theme', t)
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute('content', t === 'light' ? '#eef2f5' : '#0b1014')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
